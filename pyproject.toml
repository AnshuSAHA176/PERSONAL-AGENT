[project]
name = "personal-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anshu Saha", email = "anshusahaa62@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "celery>=5.6.3",
    "cloudinary>=1.46.2",
    "django>=5.2.17",
    "django-filter>=26.1",
    "djangorestframework>=3.18.1",
    "djangorestframework-simplejwt>=5.5.1",
    "dotenv>=0.9.9",
    "faster-whisper>=1.2.1",
    "ffmpeg>=1.4",
    "langchain>=1.4.3",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.12",
    "nltk>=3.10.3",
    "openpyxl>=3.1.5",
    "paddleocr>=3.7.0",
    "paddlepaddle>=3.3.1",
    "pgvector>=0.5.0",
    "psycopg2>=2.9.13",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "redis==5.3.1",
    "requests>=2.34.2",
]

[project.scripts]
personal-agent = "personal_agent:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
